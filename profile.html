<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Bank | Profile</title>
    <link rel="stylesheet" href="app.css">
</head>

<body>
    <header class="top"><a class="brand" href="homepage.html">SMART BANK</a>
        <nav class="nav"><a href="dashboard.html">Dashboard</a><a href="accounts.html">Accounts</a><a
                href="transfer.html">Transfer</a><a href="transactions.html">Transactions</a><a class="active"
                href="profile.html">Profile</a></nav>
    </header>
    <main class="page">
        <h1 class="title">My profile</h1>
        <p class="subtitle">Update your personal information.</p>
        <section class="box" style="max-width:620px">
            <form action="dashboard.html"><label for="name">Full name</label><input id="name" type="text"
                    value="Student Name" required><label for="profile-email">Email address</label><input
                    id="profile-email" type="email" value="student@example.com" required><label for="phone">Phone
                    number</label><input id="phone" type="tel" value="9876543210" required><label
                    for="address">Address</label><textarea id="address">Your city, India</textarea><button
                    type="submit">Save changes</button></form>
        </section>
    </main>
    <footer class="footer">Smart Bank college project demo</footer>
</body>

</html>
