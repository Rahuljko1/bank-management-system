<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="../images/favicon.svg">
    <meta name="description" content="Sign in or create a Smart Bank account to explore the banking interface.">
    <title>Smart Bank | Login</title>
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/editorial.css">
</head>

<body class="auth-page">
    <main class="page">
        <section class="box" id="login-box" aria-labelledby="login-title">
            <a class="home" href="homepage.html">Home</a>
            <div class="logo" aria-hidden="true">SB</div>
            <p class="bank">SMART BANK</p>
            <h1 id="login-title">Welcome back</h1>
            <p class="text">Sign in to explore your account.</p>

            <form id="login-form">
                <label for="username">Email address</label>
                <input id="username" name="email" type="email" autocomplete="username" required>

                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>

                <div class="options">
                    <label class="save"><input type="checkbox" name="remember"> Remember me</label>
                    <a href="forgot-password.html">Forgot password?</a>
                </div>

                <button type="submit">Login</button>
            </form>

            <p class="new-user">Don't have an account? <button class="link-button" id="show-signup" type="button">Create
                    one</button></p>
        </section>

        <section class="box hide" id="signup-box" aria-labelledby="signup-title">
            <a class="home" href="homepage.html">← Home</a>
            <div class="logo" aria-hidden="true">SB</div>
            <p class="bank">SMART BANK</p>
            <h2 id="signup-title">Create account</h2>
            <p class="text">Fill in your details to create an account.</p>

            <form id="signup-form">
                <label for="new-username">Username</label>
                <input id="new-username" name="username" type="text" autocomplete="username" minlength="3" maxlength="40" pattern="[A-Za-z0-9_]{3,40}" required>

                <label for="full-name">Full name</label>
                <input id="full-name" name="fullName" type="text" autocomplete="name" minlength="2" maxlength="100" required>

                <label for="email">Email address</label>
                <input id="email" name="email" type="email" autocomplete="email" required>

                <label for="new-password">Password</label>
                <input id="new-password" name="password" type="password" autocomplete="new-password" minlength="8" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}" title="Use at least 8 characters with uppercase, lowercase, a number, and a symbol" required>

                <button type="submit">Create account</button>
            </form>

            <p class="new-user">Already have an account? <button class="link-button" id="show-login" type="button">Sign
                    in</button></p>
        </section>
    </main>
    <p id="auth-message" class="api-message" role="status" aria-live="polite" hidden></p>
    <script type="module" src="../js/login.js"></script>
    <script type="module" src="../js/hey.js"></script>
</body>

</html>
