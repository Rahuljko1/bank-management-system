<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="../images/favicon.svg">
    <meta name="description" content="Review your Smart Bank profile and account details.">
    <title>Smart Bank | Profile</title>
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/editorial.css">
</head>

<body class="app-page" data-page="profile">
    <header aria-label="Site header"></header>
    <main class="page app-content">
        <h1 class="title">My profile</h1>
        <p class="subtitle">Update your personal information.</p>
        <p data-api-message class="api-message" role="status" aria-live="polite" hidden></p>
        <section class="box narrow-panel">
            <form id="profile-form"><label for="name">Full name</label><input id="name" name="fullName" type="text" minlength="2" maxlength="100" required><label for="profile-email">Email address</label><input id="profile-email" name="email" type="email" autocomplete="email" required><button type="submit">Save changes</button></form>
        </section>
        <section class="box narrow-panel stacked-panel">
            <h2>Change password</h2>
            <form id="change-password-form"><label for="current-password">Current password</label><input id="current-password" name="currentPassword" type="password" autocomplete="current-password" required><label for="updated-password">New password</label><input id="updated-password" name="newPassword" type="password" autocomplete="new-password" minlength="8" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}" required><button type="submit">Change password</button></form>
        </section>
    </main>
    <footer aria-label="Site footer"></footer>
    <script type="module" src="../js/hey.js?v=session-nav-1"></script>
</body>

</html>
