<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="../images/favicon.svg">
    <meta name="description" content="Get help recovering access to your Smart Bank account.">
    <title>Smart Bank | Reset Password</title>
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/editorial.css">
</head>

<body class="marketing-page" data-page="forgot-password">
    <header aria-label="Site header"></header>
    <main class="page recovery-content">
        <section class="box narrow-panel">
            <h1 class="title">Forgot password?</h1>
            <p class="subtitle">Development only: a reset token is shown locally. No reset email is sent.</p>
            <p data-api-message class="api-message" role="status" aria-live="polite" hidden></p>
            <form id="reset-request-form"><label for="reset-email">Email address</label><input id="reset-email" name="email" type="email" autocomplete="email" required><button type="submit">Request reset token</button></form>
            <p data-reset-token class="api-message success" hidden></p>
            <form id="reset-form" hidden><label for="reset-token">Reset token</label><input id="reset-token" name="token" autocomplete="off" required><label for="new-reset-password">New password</label><input id="new-reset-password" name="newPassword" type="password" autocomplete="new-password" minlength="8" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}" required><button type="submit">Set new password</button></form>
            <p><a class="link" href="login.html">Back to login</a></p>
        </section>
    </main>
    <footer aria-label="Site footer"></footer>
    <script type="module" src="../js/hey.js"></script>
</body>

</html>
