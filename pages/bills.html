<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Smart Bank | Fictional bills</title><link rel="stylesheet" href="../css/app.css"><link rel="stylesheet" href="../css/main.css"><link rel="stylesheet" href="../css/editorial.css"></head><body class="app-page" data-page="bills"><header aria-label="Site header"></header><main class="page app-content"><h1 class="title">Pay a fictional bill</h1><p class="subtitle">Demo only — no real biller is contacted.</p><p data-api-message class="api-message" role="status" hidden></p><section class="box narrow-panel"><form id="bill-form"><label>From account<select name="fromAccountId" required><option>Loading…</option></select></label><label>Category<select name="category" required><option value="electricity">Electricity</option><option value="mobile">Mobile recharge</option><option value="broadband">Broadband</option><option value="gas">Gas</option><option value="insurance">Insurance</option></select></label><label>Consumer reference<input name="consumerReference" pattern="[A-Za-z0-9-]{4,40}" required></label><label>Amount (₹)<input name="amount" type="number" min="0.01" step="0.01" required></label><button type="submit">Pay fictional bill</button></form></section><section class="box table-wrap"><table><thead><tr><th>Date</th><th>Category</th><th>Reference</th><th>Amount</th></tr></thead><tbody data-bill-rows></tbody></table></section></main><footer aria-label="Site footer"></footer><script type="module" src="../js/hey.js"></script></body></html>
