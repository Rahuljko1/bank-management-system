<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Bank | Create Account</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <main class="page">
        <section class="box" aria-labelledby="signup-title">
            <a class="home" href="homepage.html">← Home</a>
            <div class="logo" aria-hidden="true">SB</div>
            <p class="bank">SMART BANK</p>
            <h1 id="signup-title">Create account</h1>
            <p class="text">Fill in your details to create an account.</p>

            <form action="#" method="post">
                <label for="new-username">Username</label>
                <input id="new-username" name="new-username" type="text" autocomplete="username" required>

                <label for="email">Email address</label>
                <input id="email" name="email" type="email" autocomplete="email" required>

                <label for="new-password">Password</label>
                <input id="new-password" name="new-password" type="password" autocomplete="new-password" required>

                <button type="submit">Create account</button>
            </form>

            <p class="new-user">Already have an account? <a href="login.html">Sign in</a></p>
        </section>
    </main>
</body>

</html>
