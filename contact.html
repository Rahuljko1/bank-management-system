<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Bank | Contact</title>
    <link rel="stylesheet" href="app.css">
</head>

<body>
    <header class="top"><a class="brand" href="homepage.html">SMART BANK</a>
        <nav class="nav"><a href="homepage.html">Home</a><a href="about.html">About</a><a href="login.html">Login</a><a
                class="active" href="contact.html">Contact</a></nav>
    </header>
    <main class="page">
        <h1 class="title">Contact us</h1>
        <p class="subtitle">We are here to help with your banking questions.</p>
        <section class="grid two">
            <article class="box">
                <h2>Contact information</h2>
                <p>Helpline: 1800-123-4567</p>
                <p>Email: support@smartbank.demo</p>
                <p>Address: Smart Bank, Your City, India</p>
            </article>
            <section class="box">
                <h2>Send a message</h2>
                <form action="homepage.html"><label for="contact-name">Name</label><input id="contact-name" type="text"
                        required><label for="contact-email">Email</label><input id="contact-email" type="email"
                        required><label for="message">Message</label><textarea id="message" required></textarea><button
                        type="submit">Send message</button></form>
            </section>
        </section>
    </main>
    <footer class="footer">Smart Bank college project demo</footer>
</body>

</html>
